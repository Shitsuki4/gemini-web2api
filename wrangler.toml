name = "gemini-web2api-native"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/admin/*", "/v1/*", "/v1beta/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "gemini-web2api-v3"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "GeminiAccount"

# Retain the old deployment's migration history. EgressRelay is retired in v2.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EgressRelay"]
[[migrations]]
tag = "v2"
deleted_classes = ["EgressRelay"]
new_sqlite_classes = ["GeminiAccount"]

[vars]
UPSTREAM_TRANSPORT = "socket"
DEFAULT_MODEL = "gemini-3.6-flash"
MAX_ACCOUNTS = "5"
MAX_REQUEST_BYTES = "1048576"
REQUEST_TIMEOUT_MS = "180000"
SESSION_TTL_SECONDS = "604800"
# "auto" is normal placement; regional hints are best-effort, not an IP guarantee.
ACCOUNT_LOCATION_HINT = "wnam"

[observability]
enabled = false
